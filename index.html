<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر الاحترافي الشامل</title>
    <!-- خط تاجوال -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #16a34a;
            --dark: #0f172a;
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --bg-header: rgba(255, 255, 255, 0.95);
            --text-color: #0f172a;
            --border-color: #e2e8f0;
            --gray: #64748b;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --radius: 16px;
        }

        body.dark-theme {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-header: rgba(30, 41, 59, 0.95);
            --text-color: #f8fafc;
            --border-color: #334155;
            --gray: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: background-color 0.25s, color 0.25s;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-color);
            display: flex; flex-direction: column; min-height: 100vh;
        }

        .announcement-bar {
            background: linear-gradient(90deg, #2563eb, #1d4ed8);
            color: white; text-align: center; padding: 8px; font-size: 0.85rem; font-weight: 700;
        }

        header {
            background: var(--bg-header); backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color); padding: 12px 20px;
        }

        .header-container {
            max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 15px;
        }

        .logo { font-size: 1.3rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .header-actions { display: flex; align-items: center; gap: 10px; }

        .btn-icon {
            background: none; border: 1px solid var(--border-color); color: var(--text-color);
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center; position: relative;
        }

        .admin-btn { background: #8b5cf6; color: white; border: none; }

        .cart-btn {
            background: var(--primary); color: white; border: none;
            padding: 8px 18px; border-radius: 30px; cursor: pointer;
            display: flex; align-items: center; gap: 8px; font-weight: 700;
        }

        .cart-badge { background: #ef4444; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; flex: 1; }

        /* البحث والتصفية بأسلوب عصري */
        .search-section { margin-bottom: 20px; }
        .search-box { position: relative; width: 100%; }
        .search-box input {
            width: 100%; padding: 14px 45px 14px 15px; border-radius: 12px;
            border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-color);
            font-size: 0.95rem; outline: none; box-shadow: var(--shadow);
        }
        .search-box i { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--gray); font-size: 1.1rem; }

        /* شريط الأقسام المطور مع إضافة قسم جديد */
        .categories-wrapper {
            display: flex; align-items: center; gap: 10px; margin-bottom: 25px;
        }

        .categories-bar {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; flex: 1; scrollbar-width: none;
        }
        .categories-bar::-webkit-scrollbar { display: none; }

        .category-btn {
            background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-color);
            padding: 10px 18px; border-radius: 30px; font-weight: 700; cursor: pointer; white-space: nowrap;
            display: flex; align-items: center; gap: 8px; font-size: 0.9rem; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .category-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* زر إضافة قسم جديد بجانب الأقسام */
        .add-category-btn {
            background: #10b981; color: white; border: none; padding: 10px 16px;
            border-radius: 30px; font-weight: 700; cursor: pointer; white-space: nowrap;
            display: flex; align-items: center; gap: 6px; font-size: 0.85rem; flex-shrink: 0;
        }

        /* شبكة المنتجات الأنيقة */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .product-card {
            background: var(--bg-card); border-radius: var(--radius); overflow: hidden;
            box-shadow: var(--shadow); border: 1px solid var(--border-color); display: flex; flex-direction: column;
            transition: transform 0.2s ease;
        }
        .product-card:hover { transform: translateY(-3px); }

        .product-img-wrapper { position: relative; cursor: pointer; overflow: hidden; height: 200px; background: #e2e8f0; }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        .img-badge { position: absolute; bottom: 10px; right: 10px; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; }

        .product-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 1rem; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }
        .product-price { font-size: 1.2rem; font-weight: 800; color: var(--secondary); margin-bottom: 15px; }

        .action-btns { display: flex; gap: 8px; margin-top: auto; }
        .add-btn { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: 700; flex: 1; font-size: 0.9rem; }
        .quick-buy-btn { background: var(--secondary); color: white; border: none; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: 700; flex: 1; font-size: 0.9rem; }

        .whatsapp-float {
            position: fixed; bottom: 20px; left: 20px; background-color: #25d366; color: white;
            width: 55px; height: 55px; border-radius: 50%; text-align: center; font-size: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 150; display: flex; align-items: center; justify-content: center;
            text-decoration: none;
        }

        footer { background: #0f172a; color: white; padding: 30px 20px 20px; margin-top: auto; }
        .footer-container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 15px; text-align: center; }

        /* Modal النوافذ المنبثقة */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); z-index: 200; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { background: var(--bg-card); color: var(--text-color); width: 100%; max-width: 480px; border-radius: var(--radius); padding: 20px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 15px; }

        .back-arrow-btn { background: none; border: none; color: var(--text-color); font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: bold; }

        .camera-upload-box {
            border: 2px dashed var(--border-color); border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; margin-bottom: 12px; background: rgba(0,0,0,0.02);
        }
        .camera-upload-box i { font-size: 2rem; color: var(--primary); margin-bottom: 5px; }
        .preview-images-container { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; }
        .preview-img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-color); }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; outline: none; background: var(--bg-card); color: var(--text-color); font-size: 0.95rem; }
        .btn-success { background: var(--secondary); color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 10px; font-size: 1rem; }
        
        .admin-item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <div class="announcement-bar">🎉 أهلاً بك! شحن سريع وتوصيل لجميع المناطق</div>

    <header>
        <div class="header-container">
            <div class="logo"><i class="fa-solid fa-shop"></i> المتجر الاحترافي</div>
            <div class="header-actions">
                <button class="btn-icon admin-btn" onclick="openAdminModal()" title="إضافة منتج">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button class="btn-icon" onclick="toggleTheme()" title="الوضع الداكن">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
                <button class="cart-btn" onclick="toggleCart()">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>السلة</span>
                    <span class="cart-badge" id="cartBadge">0</span>
                </button>
            </div>
        </div>
    </header>

    <a href="https://wa.me/966500000000" class="whatsapp-float" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>

    <div class="container">
        <!-- البحث المباشر -->
        <div class="search-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="ابحث عن المنتجات هنا...">
            </div>
        </div>

        <!-- الأقسام المتفاعلة مع زر إضافة قسم جديد -->
        <div class="categories-wrapper">
            <div class="categories-bar" id="categoriesContainer">
                <!-- يتم توليد الأقسام ديناميكياً بواسطة JavaScript -->
            </div>
            <!-- زر إضافة قسم جديد -->
            <button class="add-category-btn" onclick="openAddCategoryModal()">
                <i class="fa-solid fa-plus"></i> إضافة قسم
            </button>
        </div>

        <!-- معرض المنتجات الشبكي -->
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- الفوتر -->
    <footer>
        <div class="footer-container">
            <div style="font-weight: 800; font-size: 1rem;"><i class="fa-solid fa-headset"></i> خدمة العملاء والدعم الفني</div>
            <div style="font-size: 0.8rem; color: #64748b;">© جميع الحقوق محفوظة 2026</div>
        </div>
    </footer>

    <!-- نافذة إضافة قسم جديد -->
    <div class="modal" id="addCategoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="back-arrow-btn" onclick="closeModal('addCategoryModal')">
                    <i class="fa-solid fa-arrow-right"></i> إلغاء
                </button>
                <h3>إضافة قسم جديد</h3>
            </div>
            <form onsubmit="saveNewCategory(event)">
                <div class="form-group">
                    <label>اسم القسم الجديد *</label>
                    <input type="text" id="newCatName" placeholder="مثال: عطور، ملابس، أحذية..." required>
                </div>
                <button type="submit" class="btn-success">حفظ القسم وإضافته</button>
            </form>
        </div>
    </div>

    <!-- نافذة لوحة التحكم وإضافة المنتج -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="back-arrow-btn" onclick="closeModal('adminModal')">
                    <i class="fa-solid fa-arrow-right"></i> رجوع
                </button>
                <h3>إضافة وتعديل منتج</h3>
            </div>

            <form id="adminForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="editProductId">
                
                <div class="form-group">
                    <label>صورة المنتج (التقط صورة أو اختر من المعرض):</label>
                    <div class="camera-upload-box" onclick="document.getElementById('cameraInput').click()">
                        <i class="fa-solid fa-camera"></i>
                        <p style="font-size:0.85rem; font-weight:bold;">اضغط لالتقاط صورة بالهاتف</p>
                        <input type="file" id="cameraInput" accept="image/*" capture="environment" multiple style="display:none;" onchange="handleCameraUpload(event)">
                    </div>
                    <div class="preview-images-container" id="previewContainer"></div>
                </div>

                <div class="form-group">
                    <label>اسم المنتج *</label>
                    <input type="text" id="prodName" required placeholder="أدخل اسم المنتج">
                </div>
                <div class="form-group">
                    <label>السعر (ر.س) *</label>
                    <input type="number" id="prodPrice" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>اختر القسم *</label>
                    <select id="prodCategory" required></select>
                </div>
                <button type="submit" class="btn-success" id="adminSubmitBtn">نشر المنتج فوراً</button>
            </form>

            <hr style="margin: 20px 0; border: none; border-top: 1px solid var(--border-color);">
            <h4>إدارة المنتجات المنشورة:</h4>
            <div id="adminProductsList" style="margin-top: 10px;"></div>
        </div>
    </div>

    <!-- نافذة عرض صور المنتج -->
    <div class="modal" id="galleryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="galleryTitle">معاينة المنتج</h3>
                <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="closeModal('galleryModal')"></i>
            </div>
            <img src="" id="mainGalleryImg" style="width:100%; height:230px; object-fit:cover; border-radius:10px; margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                <b id="galleryPrice" style="font-size: 1.2rem; color: var(--secondary);"></b>
                <button class="add-btn" id="galleryAddBtn">إضافة للسلة</button>
            </div>
        </div>
    </div>

    <!-- نافذة السلة -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-cart-shopping"></i> سلة الشراء</h3>
                <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="closeModal('cartModal')"></i>
            </div>
            <div id="cartItemsList"></div>
            <div style="border-top: 1px solid var(--border-color); padding-top: 10px; margin-top:10px;">
                <div style="display:flex; justify-content:space-between; font-weight:800;">
                    <span>الإجمالي:</span>
                    <span id="cartSubtotal">0 ر.س</span>
                </div>
                <button class="btn-success" onclick="openCheckout()">متابعة الدفع</button>
            </div>
        </div>
    </div>

    <!-- نافذة الشراء -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>إتمام الطلب</h3>
                <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="closeModal('checkoutModal')"></i>
            </div>
            <form onsubmit="submitOrder(event)">
                <div class="form-group"><label>الاسم الكامل</label><input type="text" required></div>
                <div class="form-group"><label>رقم الجوال</label><input type="tel" required></div>
                <div class="form-group"><label>العنوان</label><input type="text" required></div>
                <button type="submit" class="btn-success">تأكيد الطلب</button>
            </form>
        </div>
    </div>

    <script>
        // الأقسام الافتراضية
        let categories = JSON.parse(localStorage.getItem('myStoreCategories')) || [
            { id: 'all', name: 'الكل', icon: 'fa-border-all' },
            { id: 'phones', name: 'جوالات', icon: 'fa-mobile-screen-button' },
            { id: 'watches', name: 'ساعات', icon: 'fa-clock' },
            { id: 'accessories', name: 'إكسسوارات', icon: 'fa-headphones' }
        ];

        const defaultProducts = [
            { id: 1, name: "سماعة لاسلكية احترافية", price: 199, category: "accessories", images: ["https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"] },
            { id: 2, name: "ساعة رقمية رياضية", price: 249, category: "watches", images: ["https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600"] }
        ];

        let products = JSON.parse(localStorage.getItem('myStoreProducts')) || defaultProducts;
        let cart = [];
        let currentCategory = 'all';
        let uploadedImagesBase64 = [];

        function saveCategoriesToStorage() { localStorage.setItem('myStoreCategories', JSON.stringify(categories)); }
        function saveProductsToStorage() { localStorage.setItem('myStoreProducts', JSON.stringify(products)); }

        // عرض الأقسام ديناميكياً
        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            const selectContainer = document.getElementById('prodCategory');
            
            container.innerHTML = categories.map(cat => `
                <button class="category-btn ${currentCategory === cat.id ? 'active' : ''}" onclick="filterCategory('${cat.id}', this)">
                    <i class="fa-solid ${cat.icon || 'fa-tag'}"></i> ${cat.name}
                </button>
            `).join('');

            // تحديث قائمة الاختيار داخل نافذة إضافة المنتج
            selectContainer.innerHTML = categories.filter(c => c.id !== 'all').map(cat => `
                <option value="${cat.id}">${cat.name}</option>
            `).join('');
        }

        function openAddCategoryModal() {
            document.getElementById('addCategoryModal').style.display = 'flex';
        }

        function saveNewCategory(e) {
            e.preventDefault();
            const catName = document.getElementById('newCatName').value.trim();
            if(!catName) return;

            const newId = 'cat_' + Date.now();
            categories.push({ id: newId, name: catName, icon: 'fa-tag' });
            
            saveCategoriesToStorage();
            renderCategories();
            document.getElementById('newCatName').value = '';
            closeModal('addCategoryModal');
            alert(`تم إضافة قسم "${catName}" بنجاح!`);
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            let filtered = products.filter(p => {
                const matchCategory = (currentCategory === 'all' || p.category === currentCategory);
                const matchSearch = p.name.toLowerCase().includes(searchVal);
                return matchCategory && matchSearch;
            });

            if(filtered.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--gray); padding: 40px 0;">لا توجد منتجات في هذا القسم حالياً.</p>`;
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="product-card">
                    <div class="product-img-wrapper" onclick="openGallery(${p.id})">
                        <img src="${p.images[0]}" class="product-img" alt="${p.name}">
                        <span class="img-badge"><i class="fa-solid fa-images"></i> ${p.images.length}</span>
                    </div>
                    <div class="product-info">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${p.price} ر.س</div>
                        <div class="action-btns">
                            <button class="add-btn" onclick="addToCart(${p.id})">السلة</button>
                            <button class="quick-buy-btn" onclick="quickBuy(${p.id})">شراء</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function handleCameraUpload(e) {
            const files = e.target.files;
            if(!files || files.length === 0) return;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImagesBase64.push(event.target.result);
                    updateImagesPreview();
                };
                reader.readAsDataURL(file);
            });
        }

        function updateImagesPreview() {
            const container = document.getElementById('previewContainer');
            container.innerHTML = uploadedImagesBase64.map(imgSrc => `
                <img src="${imgSrc}" class="preview-img">
            `).join('');
        }

        function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('editProductId').value;
            const name = document.getElementById('prodName').value;
            const price = parseFloat(document.getElementById('prodPrice').value);
            const category = document.getElementById('prodCategory').value;

            let finalImages = uploadedImagesBase64.length > 0 ? uploadedImagesBase64 : ["https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"];

            if(id) {
                const prod = products.find(p => p.id == id);
                prod.name = name; prod.price = price; prod.category = category;
                if(uploadedImagesBase64.length > 0) prod.images = uploadedImagesBase64;
            } else {
                const newProd = { id: Date.now(), name, price, category, images: finalImages };
                products.push(newProd);
            }

            saveProductsToStorage();
            renderProducts();
            renderAdminList();
            
            document.getElementById('adminForm').reset();
            uploadedImagesBase64 = [];
            document.getElementById('previewContainer').innerHTML = '';
            document.getElementById('editProductId').value = '';
            closeModal('adminModal');
            alert("تم نشر المنتج بنجاح!");
        }

        function openGallery(id) {
            const prod = products.find(p => p.id === id);
            document.getElementById('galleryTitle').innerText = prod.name;
            document.getElementById('galleryPrice').innerText = `${prod.price} ر.س`;
            document.getElementById('mainGalleryImg').src = prod.images[0];
            document.getElementById('galleryAddBtn').onclick = function() { addToCart(prod.id); closeModal('galleryModal'); };
            document.getElementById('galleryModal').style.display = 'flex';
        }

        function filterCategory(catId, btn) {
            currentCategory = catId;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts();
        }

        function filterProducts() { renderProducts(); }

        function openAdminModal() { renderAdminList(); document.getElementById('adminModal').style.display = 'flex'; }

        function renderAdminList() {
            const list = document.getElementById('adminProductsList');
            list.innerHTML = products.map(p => `
                <div class="admin-item-row">
                    <div><b>${p.name}</b> - <span style="color:var(--secondary);">${p.price} ر.س</span></div>
                    <div>
                        <button onclick="editProduct(${p.id})" style="background:#eab308; color:white; border:none; padding:5px 10px; border-radius:6px; cursor:pointer;"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteProduct(${p.id})" style="background:#ef4444; color:white; border:none; padding:5px 10px; border-radius:6px; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function editProduct(id) {
            const p = products.find(prod => prod.id === id);
            document.getElementById('editProductId').value = p.id;
            document.getElementById('prodName').value = p.name;
            document.getElementById('prodPrice').value = p.price;
            document.getElementById('prodCategory').value = p.category;
            uploadedImagesBase64 = [...p.images];
            updateImagesPreview();
        }

        function deleteProduct(id) {
            if(confirm("هل أوتأكد من حذف هذا المنتج؟")) {
                products = products.filter(p => p.id !== id);
                saveProductsToStorage();
                renderProducts();
                renderAdminList();
            }
        }

        function addToCart(id) {
            const item = cart.find(c => c.id === id);
            if(item) { item.qty++; } 
            else { const p = products.find(prod => prod.id === id); cart.push({...p, qty: 1}); }
            updateCart();
        }

        function quickBuy(id) { cart = []; addToCart(id); openCheckout(); }

        function updateCart() {
            document.getElementById('cartBadge').innerText = cart.reduce((s, i) => s + i.qty, 0);
            const list = document.getElementById('cartItemsList');
            let total = 0;
            list.innerHTML = cart.map(item => {
                total += item.price * item.qty;
                return `<div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>${item.name} (x${item.qty})</span><b>${item.price * item.qty} ر.س</b></div>`;
            }).join('');
            document.getElementById('cartSubtotal').innerText = `${total} ر.س`;
        }

        function toggleCart() { document.getElementById('cartModal').style.display = 'flex'; }
        function openCheckout() { closeModal('cartModal'); document.getElementById('checkoutModal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function submitOrder(e) {
            e.preventDefault();
            alert("تم إرسال الطلب بنجاح!");
            cart = []; updateCart(); closeModal('checkoutModal');
        }

        function toggleTheme() { document.body.classList.toggle('dark-theme'); }

        renderCategories();
        renderProducts();
    </script>
</body>
</html>
