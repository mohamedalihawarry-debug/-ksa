<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawarry</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --dark-color: #1e293b;
            --bg-color: #f8fafc;
            --price-color: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--dark-color);
            padding-bottom: 50px;
        }

        /* الهيدر */
        header {
            background: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .cart-btn {
            background: #e2e8f0;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
        }

        .cart-count {
            background: #ef4444;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 0.8rem;
        }

        /* البانر */
        .hero {
            background: var(--primary-color);
            color: white;
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 30px;
        }

        /* شبكة المنتجات */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            background: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
        }

        .product-title {
            font-size: 1.1rem;
            margin: 10px 0 5px;
        }

        .product-price {
            color: var(--price-color);
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .add-to-cart {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
        }

        /* نافذة السلة (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .whatsapp-btn {
            background: #25D366;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }

        /* إشعار إضافة منتج بسيط */
        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 300;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <header>
        <div class="logo">Hawarry </div>
        <button class="cart-btn" onclick="toggleCart()">
            🛒 السلة <span class="cart-count" id="cartCount">0</span>
        </button>
    </header>

    <div class="hero">
        <h1>مرحباً بك في متجرك الجديد</h1>
        <p>اكتشف أحدث العروض والمنتجات بأفضل الأسعار</p>
    </div>

    <div class="container">
        <h2>أحدث المنتجات</h2>
        <br>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- نافذة السلة -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <h3>محتويات السلة</h3>
            <br>
            <div id="cartItems">محتوى السلة فارغ</div>
            <br>
            <h4>الإجمالي: <span id="cartTotal">0</span> ر.س</h4>
            <button class="whatsapp-btn" onclick="sendToWhatsapp()">إتمام الطلب عبر الواتساب</button>
            <button onclick="toggleCart()" style="margin-top: 10px; width:100%; padding: 8px; background:#e2e8f0; border:none; border-radius:6px; cursor:pointer;">إغلاق</button>
        </div>
    </div>

    <!-- إشعار عند التوصيل -->
    <div id="toast">تمت إضافة المنتج للسلة!</div>

    <script>
        // ضع رقم واتسابك هنا بدون فاصلة أو + (مثال: 966500000000)
        const myPhoneNumber = "966500000000"; 

        const products = [
            { id: 1, name: "سماعات لاسلكية احترافية", price: 150, img: "https://via.placeholder.com/200?text=سماعات" },
            { id: 2, name: "ساعة رقمية رياضية", price: 120, img: "https://via.placeholder.com/200?text=ساعة" },
            { id: 3, name: "شاحن سريع 65 واط", price: 80, img: "https://via.placeholder.com/200?text=شاحن" }
        ];

        let cart = [];

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.img}" class="product-img" alt="${p.name}">
                    <div class="product-title">${p.name}</div>
                    <div class="product-price">${p.price} ر.س</div>
                    <button class="add-to-cart" onclick="addToCart(${p.id})">أضف للسلة</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCartUI();
            showToast();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const cartItemsDiv = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = "السلة فارغة حالياً";
                document.getElementById('cartTotal').innerText = "0";
                return;
            }

            let total = 0;
            cartItemsDiv.innerHTML = cart.map((item, index) => {
                total += item.price;
                return `
                    <div class="cart-item">
                        <span>${item.name}</span>
                        <span><b>${item.price} ر.س</b> <button onclick="removeFromCart(${index})" style="color:red; background:none; border:none; cursor:pointer;">❌</button></span>
                    </div>
                `;
            }).join('');

            document.getElementById('cartTotal').innerText = total;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function sendToWhatsapp() {
            if(cart.length === 0) {
                alert("السلة فارغة!");
                return;
            }
            let message = "مرحباً، أود طلب المنتجات التالية:\n";
            cart.forEach(item => {
                message += `- ${item.name} (${item.price} ر.س)\n`;
            });
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            message += `\nالإجمالي: ${total} ر.س`;
            
            window.open(`https://wa.me/${myPhoneNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }

        renderProducts();
    </script>
</body>
</html>
